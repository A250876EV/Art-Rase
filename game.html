<!DOCTYPE html>
<html>
<head>
    <title>Clicker Game</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: lightblue;
        }
        button {
            padding: 10px;
            margin: 5px;
        }
        h1 {
            color: darkblue;
        }
    </style>
</head>
<body>
    <h1>Clicker Game</h1>
    <p>Score: <span id="score">0</span></p>
    <p>Power: <span id="power">1</span></p>
    <p>Level: <span id="level">1</span></p>
    <button id="click">Click</button>
    <p id="message"></p>
    <h2>Upgrades</h2>
    <button id="u1">Upgrade 1 (10)</button><br><br>
    <button id="u2">Upgrade 2 (25)</button><br><br>
    <button id="u3">Upgrade 3 (50)</button><br><br>
    <button id="u4">Upgrade 4 (100)</button>
    <script src="game.js"></script>
</body>
</html>
